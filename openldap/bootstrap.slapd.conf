# Minimal slapd.conf used ONCE at first container start (by entrypoint.sh via
# `slaptest -f ... -F /etc/ldap/slapd.d`) to generate a clean cn=config:
#   - the standard schemas
#   - the mdb backend module (so cn=module{0} exists for the orchestrator to load
#     more overlay modules into)
#   - a config database whose only administrator is root over the ldapi socket
#     (SASL/EXTERNAL, uid=0)
# It deliberately creates NO data database and NO base suffix. Everything else
# (suffix, rootDN/pw, TLS, overlays, data, syncrepl) is applied afterward over
# ldapi:/// by Ansible. This file is never used again after the first boot.
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/nis.schema
include /etc/ldap/schema/inetorgperson.schema

pidfile /run/slapd/slapd.pid
argsfile /run/slapd/slapd.args

modulepath /usr/lib/ldap
moduleload back_mdb

database config
rootdn "cn=admin,cn=config"
access to *
    by dn.exact="gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth" manage
    by * break
