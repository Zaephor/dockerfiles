---
# Hadolint configuration for dockerfiles project
# https://github.com/hadolint/hadolint

# Ignore specific rules for example Dockerfiles
ignored:
  # DL3008: Pin versions in apt-get install
  # Example Dockerfiles intentionally avoid version pinning for simplicity
  - DL3008

  # DL3015: Avoid additional packages by specifying --no-install-recommends
  # Example Dockerfiles prioritize readability over optimization
  - DL3015

  # DL3018: Pin versions in apk add
  # Example Dockerfiles intentionally avoid version pinning for simplicity
  - DL3018

  # DL4006: Set SHELL option -o pipefail
  # Some examples use /bin/sh which doesn't support pipefail
  - DL4006

  # SC2016: Expressions don't expand in single quotes
  # False positive - we intentionally use single quotes to write literal
  # shell expressions that should expand at runtime, not build time
  - SC2016

  # DL3059: Multiple consecutive RUN instructions
  # Intentionally separate RUN commands for clarity and cache optimization
  - DL3059
