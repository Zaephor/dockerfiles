name: Build and Push Docker Images

on:
  push:
    branches: '**'
  schedule:
    # Run daily at 2 AM UTC to check for upstream image updates
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (detect changes without building)'
        required: false
        default: 'false'
        type: boolean
      force_rebuild:
        description: 'Force rebuild all images or specific ones'
        required: false
        default: 'false'
        type: boolean
      image_filter:
        description: 'Comma-separated list of image names to build (others skipped)'
        required: false
        default: ''
        type: string
      skip_images:
        description: 'Comma-separated list of image names to skip'
        required: false
        default: ''
        type: string
      version_override:
        description: 'Version override in format: image_name=version (comma-separated for multiple)'
        required: false
        default: ''
        type: string
      rebuild_mode:
        description: 'Enable rebuild mode for historical version'
        required: false
        default: 'false'
        type: boolean
      rebuild_target_version:
        description: 'Target version to rebuild (from history)'
        required: false
        default: ''
        type: string
      rebuild_reason:
        description: 'Reason for rebuild'
        required: false
        default: 'manual_rebuild'
        type: string
      skip_tag_update:
        description: 'Skip tag updates'
        required: false
        default: 'false'
        type: boolean
      force_architectures:
        description: 'Override architectures (comma-separated)'
        required: false
        default: ''
        type: string

jobs:
  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run hadolint on Dockerfiles
        run: |
          # Lint all Dockerfiles in the repository
          find . -name "Dockerfile" -not -path "./.git/*" | while read -r dockerfile; do
            echo "Linting: $dockerfile"
            docker run --rm -i \
              -v "$PWD/.hadolint.yaml:/root/.config/hadolint.yaml:ro" \
              hadolint/hadolint:latest-alpine < "$dockerfile" || exit 1
          done

  test:
    name: Run BATS Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install BATS
        run: sudo npm install -g bats

      - name: Run BATS tests
        run: bats tests/unit/**/*.bats

  determine-changes:
    name: Determine Changed Images
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      expanded-matrix: ${{ steps.expand-matrix.outputs.expanded-matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate workflow dispatch inputs
        run: |
          ./.github/scripts/validate-workflow-inputs.sh \
            --image-filter "${{ github.event.inputs.image_filter }}" \
            --skip-images "${{ github.event.inputs.skip_images }}" \
            --version-override "${{ github.event.inputs.version_override }}" \
            --repo-root .

      - name: Validate rebuild request
        if: github.event.inputs.rebuild_mode == 'true'
        run: |
          source .github/scripts/lib/logging.sh
          source .github/scripts/lib/rebuild.sh

          REBUILD_TARGET_VERSION="${{ github.event.inputs.rebuild_target_version }}"

          if [[ -z "$REBUILD_TARGET_VERSION" ]]; then
            log_error "SYSTEM" "-" "REBUILD_VALIDATION" "rebuild_target_version is required when rebuild_mode is enabled"
            exit 1
          fi

          log_notice "SYSTEM" "-" "REBUILD_VALIDATION" "Rebuild request validated: version=$REBUILD_TARGET_VERSION"

      - name: Checkout historical state
        if: github.event.inputs.rebuild_mode == 'true'
        id: historical-checkout
        run: |
          source .github/scripts/lib/logging.sh
          source .github/scripts/lib/rebuild.sh

          REBUILD_TARGET_VERSION="${{ github.event.inputs.rebuild_target_version }}"
          IMAGE_NAME="${{ github.event.inputs.image_filter }}"

          if [[ -z "$IMAGE_NAME" ]]; then
            log_error "SYSTEM" "-" "REBUILD" "image_filter is required for rebuild mode"
            exit 1
          fi

          HISTORY_FILE="${IMAGE_NAME}/history.jsonl"
          if [[ ! -f "$HISTORY_FILE" ]]; then
            log_error "SYSTEM" "-" "REBUILD" "History file not found: $HISTORY_FILE"
            exit 1
          fi

          # Get commit SHA for the target version
          COMMIT_SHA=$(jq -r ".commit" "$HISTORY_FILE" | grep -m1 .)
          if [[ -z "$COMMIT_SHA" ]]; then
            log_error "SYSTEM" "-" "REBUILD" "Could not find commit SHA for version $REBUILD_TARGET_VERSION"
            exit 1
          fi

          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          log_notice "SYSTEM" "-" "REBUILD" "Historical state checkout: version=$REBUILD_TARGET_VERSION, commit=$COMMIT_SHA"

      - name: Generate build matrix
        id: set-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run matrix generation script with manual control parameters (Sprint 13)
          # Script will set matrix in GITHUB_OUTPUT directly and also output to stdout
          GENERATE_MATRIX_ARGS=(--repo-root .)

          # Add force_rebuild flag if provided
          if [[ "${{ github.event.inputs.force_rebuild }}" == "true" ]]; then
            GENERATE_MATRIX_ARGS+=(--force-rebuild all)
          fi

          # Add image_filter if provided
          if [[ -n "${{ github.event.inputs.image_filter }}" ]]; then
            GENERATE_MATRIX_ARGS+=(--image-filter "${{ github.event.inputs.image_filter }}")
          fi

          # Add skip_images if provided
          if [[ -n "${{ github.event.inputs.skip_images }}" ]]; then
            GENERATE_MATRIX_ARGS+=(--skip-images "${{ github.event.inputs.skip_images }}")
          fi

          # Add version_override if provided
          if [[ -n "${{ github.event.inputs.version_override }}" ]]; then
            GENERATE_MATRIX_ARGS+=(--version-override "${{ github.event.inputs.version_override }}")
          fi

          ./.github/scripts/generate-matrix.sh "${GENERATE_MATRIX_ARGS[@]}"

      - name: Expand matrix for architecture builds
        id: expand-matrix
        env:
          MATRIX_JSON: ${{ steps.set-matrix.outputs.matrix }}
        run: |
          source .github/scripts/lib/matrix-utils.sh

          # MATRIX_JSON is set by GitHub Actions via env: key above
          # Verify it's set and use it (silences SC2153)
          : "${MATRIX_JSON:?MATRIX_JSON must be set by workflow}"
          EXPANDED=$(matrix_expand_for_architectures "$MATRIX_JSON")

          echo "expanded-matrix=$EXPANDED" >> "$GITHUB_OUTPUT"
          echo "Expanded matrix: $EXPANDED"

      - name: Determine tags to update
        if: github.event.inputs.rebuild_mode == 'true'
        id: rebuild-tags
        run: |
          source .github/scripts/lib/logging.sh
          source .github/scripts/lib/tag-manager.sh

          REBUILD_TARGET_VERSION="${{ github.event.inputs.rebuild_target_version }}"
          IMAGE_NAME="${{ github.event.inputs.image_filter }}"
          SKIP_TAG_UPDATE="${{ github.event.inputs.skip_tag_update }}"

          if [[ "$SKIP_TAG_UPDATE" == "true" ]]; then
            log_notice "SYSTEM" "-" "REBUILD_TAGS" "Skipping tag update (skip_tag_update=true)"
            echo "tags_to_update=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HISTORY_FILE="${IMAGE_NAME}/history.jsonl"
          ALL_VERSIONS=$(jq -r '.version' "$HISTORY_FILE" | sort -u | tr '\n' ' ')

          TAGS=$(determine_tags_to_update "$REBUILD_TARGET_VERSION" "$ALL_VERSIONS")
          echo "tags_to_update=$TAGS" >> "$GITHUB_OUTPUT"

          log_notice "SYSTEM" "-" "REBUILD_TAGS" "Tags to update: $TAGS"

      - name: Generate dry-run summary report
        if: github.event.inputs.dry_run == 'true'
        run: |
          .github/scripts/generate-dryrun-report.sh \
            --matrix "${{ steps.set-matrix.outputs.matrix }}"

  build-arch:
    name: Build ${{ matrix.config.image.name }}:${{ matrix.config.image.variant }} (${{ matrix.config.arch }})
    needs: determine-changes
    runs-on: ${{ matrix.config['runs-on'] }}
    timeout-minutes: 15
    if: needs.determine-changes.outputs.matrix != '{"image":[]}' && github.event.inputs.dry_run != 'true'
    strategy:
      matrix: ${{ fromJson(needs.determine-changes.outputs.expanded-matrix) }}
      fail-fast: false
    continue-on-error: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record build start time
        id: start-time
        run: |
          # Source logging library for structured logs
          source .github/scripts/lib/logging.sh

          start_time=$(date +%s)
          echo "start=$start_time" >> "$GITHUB_OUTPUT"

          log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "BUILD_START" "Starting build for version ${{ matrix.config.image.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        run: |
          # Source logging library for structured logs
          source .github/scripts/lib/logging.sh

          # Repository name in GHCR format (lowercase required by Docker)
          GHCR_REPO="${{ github.repository }}"
          GHCR_REPO=$(echo "$GHCR_REPO" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${{ matrix.config.image.name }}"
          ARCH="${{ matrix.config.arch }}"

          # Image repository without tag (for push-by-digest)
          IMAGE_REPO="ghcr.io/${GHCR_REPO}/${IMAGE_NAME}"

          # Consolidated cache image with tag per image/arch/variant
          # All cache layers stored in single "buildcache" package
          # Escape slashes in image name for Docker tag (examples/binary-version → examples_binary-version)
          CACHE_IMAGE_NAME="${IMAGE_NAME//\//_}"
          CACHE_TAG="ghcr.io/${GHCR_REPO}/buildcache:${CACHE_IMAGE_NAME}-${ARCH}"

          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "cache_tag=${CACHE_TAG}" >> "$GITHUB_OUTPUT"

          log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "BUILD_CONFIG" "Image: ${IMAGE_NAME}, Version: ${{ matrix.config.image.version }}, Platform: ${{ matrix.config.platform }}, Reason: ${{ matrix.config.image.reason }}"

      - name: Build and push image by digest
        id: build
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          command: |
            # Source build utilities
            source .github/scripts/lib/logging.sh

            # Call build-image.sh script to handle complexity
            .github/scripts/build-image.sh \
              --image-name "${{ matrix.config.image.name }}" \
              --platform "${{ matrix.config.platform }}" \
              --dockerfile "${{ matrix.config.image.dockerfile }}" \
              --variant "${{ matrix.config.image.variant }}" \
              --arch "${{ matrix.config.arch }}" \
              --image-repo "${{ steps.meta.outputs.image_repo }}" \
              --cache-tag "${{ steps.meta.outputs.cache_tag }}" \
              --source-url "${{ github.server_url }}/${{ github.repository }}" \
              --revision "${{ github.sha }}" \
              --version "${{ matrix.config.image.version }}"

      - name: Retry push if registry temporarily unavailable
        id: push-with-retry
        if: steps.build.outcome == 'success'
        run: |
          .github/scripts/verify-registry-push.sh \
            --image-repo "${{ steps.meta.outputs.image_repo }}" \
            --arch "${{ matrix.config.arch }}" \
            --image-name "${{ matrix.config.image.name }}" \
            --build-metadata "/tmp/build-metadata.json"

      - name: Verify container image
        id: verify
        if: steps.build.outcome == 'success' && steps.push-with-retry.outcome == 'success'
        run: |
          source .github/scripts/lib/logging.sh

          # Get the image reference with digest
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)
          IMAGE_REF="${{ steps.meta.outputs.image_repo }}@${DIGEST}"

          log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "VERIFY_START" "Running verification for ${IMAGE_REF}"

          # Run verification using metadata.yaml config
          # The verify script will check if verification is configured
          # Note: --image-tag is optional; we use digest reference for precision
          if .github/scripts/verify-image.sh \
            --image-name "${IMAGE_REF}" \
            --config "${{ matrix.config.image.name }}/metadata.yaml"; then
            log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "VERIFY_SUCCESS" "Verification passed"
          else
            log_error "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "VERIFY_FAILED" "Verification failed - image will not be included in manifest"
            exit 1
          fi

      - name: Export digest
        id: push
        if: steps.build.outcome == 'success' && steps.push-with-retry.outcome == 'success' && steps.verify.outcome == 'success'
        run: |
          # Source logging library
          source .github/scripts/lib/logging.sh

          # Capture digest from buildx metadata file
          # The metadata file contains the actual image digest after push-by-digest
          mkdir -p /tmp/digests

          # Extract digest from metadata JSON (containerimage.digest field)
          digest=$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)

          # Validate digest format
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            log_error "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "DIGEST_EXPORT" "Invalid digest format: $digest"
            exit 1
          fi

          # Get retry count from previous step
          retry_attempts="${{ steps.push-with-retry.outputs.retry_attempts }}"
          if [ -z "$retry_attempts" ]; then
            retry_attempts=0
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "retry_attempts=${retry_attempts}" >> "$GITHUB_OUTPUT"
          echo "${digest}" > /tmp/digests/${{ matrix.config.arch }}.txt

          log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "DIGEST_EXPORT" "Captured digest: ${digest:0:12}... (retries: $retry_attempts)"

      - name: Calculate cache hit rate and image metrics
        id: metrics
        if: steps.build.outcome == 'success'
        run: |
          # Source logging library (performance-metrics not needed in this step)
          source .github/scripts/lib/logging.sh

          # Calculate current build duration
          # (end-time step runs later, so we calculate inline here)
          end=$(date +%s)
          start=${{ steps.start-time.outputs.start }}
          CURRENT_DURATION=$((end - start))

          # Estimate cache hit rate from build duration vs historical average
          # Uses the last 5 successful builds as baseline
          # Formula: faster builds = higher cache hit rate
          if [ -n "$CURRENT_DURATION" ] && [ "$CURRENT_DURATION" != "0" ]; then
            CACHE_HIT_RATE=$(.github/scripts/estimate-cache-hit-rate.sh \
              "${{ matrix.config.image.name }}" \
              "${{ matrix.config.arch }}" \
              "$CURRENT_DURATION" || echo "null")
          else
            CACHE_HIT_RATE="null"
          fi

          echo "cache_hit_rate=${CACHE_HIT_RATE}" >> "$GITHUB_OUTPUT"

          log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "METRICS" "Cache metrics calculated (cache_hit_rate: ${CACHE_HIT_RATE})"

      - name: Capture image size from manifest
        id: image-size
        if: steps.build.outcome == 'success' && steps.push.outcome == 'success'
        run: |
          # Source performance metrics and logging libraries
          source .github/scripts/lib/performance-metrics.sh
          source .github/scripts/lib/logging.sh

          # Get image size from Docker manifest
          IMAGE_TAG="${{ steps.meta.outputs.image_repo }}@${{ steps.push.outputs.digest }}"

          # Try to get image size using docker buildx imagetools
          # This gets the config blob size and is available after push
          IMAGE_SIZE="null"
          if docker buildx imagetools inspect "$IMAGE_TAG" > /dev/null 2>&1; then
            # Docker buildx imagetools doesn't directly provide size, so we estimate from manifest
            # For now, set to null until we have manifest size data available
            IMAGE_SIZE="null"
          fi

          echo "image_size=${IMAGE_SIZE}" >> "$GITHUB_OUTPUT"

          if [[ "${IMAGE_SIZE}" != "null" ]]; then
            SIZE_HUMAN=$(format_size_human "$IMAGE_SIZE")
            log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "IMAGE_SIZE" "Size: ${SIZE_HUMAN}"
          else
            log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "IMAGE_SIZE" "Size unavailable (will be calculated on next build for comparison)"
          fi

      - name: Prepare artifact name (escape slashes for nested folders)
        id: artifact-name
        if: always()  # Always run to ensure outputs are set even on failure
        run: |
          # Replace / with _ for artifact names (nested folders like traefik/traefik)
          ESCAPED_NAME="${{ matrix.config.image.name }}"
          ESCAPED_NAME="${ESCAPED_NAME//\//_}"

          # Ensure name is never empty - fallback to "unknown" if empty
          if [ -z "$ESCAPED_NAME" ]; then
            echo "WARNING: Image name is empty, using 'unknown'" >&2
            ESCAPED_NAME="unknown"
          fi

          echo "escaped=${ESCAPED_NAME}" >> "$GITHUB_OUTPUT"
          echo "Artifact name prefix: ${ESCAPED_NAME}"

      - name: Upload digest artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.artifact-name.outputs.escaped }}-${{ matrix.config.image.variant }}-${{ matrix.config.arch }}
          path: /tmp/digests/${{ matrix.config.arch }}.txt
          retention-days: 1

      - name: Record build status
        if: always()
        run: |
          # Source logging library
          source .github/scripts/lib/logging.sh

          # Record explicit build status for manifest coordination
          mkdir -p /tmp/status
          echo "${{ steps.build.outcome }}" > /tmp/status/${{ matrix.config.arch }}.txt

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "BUILD_STATUS" "success"
          else
            log_warning "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "BUILD_STATUS" "failed"
          fi

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ steps.artifact-name.outputs.escaped }}-${{ matrix.config.image.variant }}-${{ matrix.config.arch }}
          path: /tmp/status/${{ matrix.config.arch }}.txt
          retention-days: 1

      - name: Record build end time and duration
        id: end-time
        if: always()
        run: |
          # Source logging library
          source .github/scripts/lib/logging.sh

          end=$(date +%s)
          start=${{ steps.start-time.outputs.start }}
          duration=$((end - start))
          minutes=$((duration / 60))
          seconds=$((duration % 60))

          echo "end=${end}" >> "$GITHUB_OUTPUT"
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"

          log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "BUILD_END" "Build completed in ${minutes}m ${seconds}s"

          # Performance validation: Warn if build took >10 minutes
          if [ ${duration} -gt 600 ]; then
            log_warning "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "PERFORMANCE" "Build duration (${minutes}m ${seconds}s) exceeded 10 minute target"
          fi

      - name: Log build summary
        if: always()
        run: |
          # Source logging library
          source .github/scripts/lib/logging.sh

          # Log build summary with structured format
          log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "BUILD_SUMMARY" "Repository: ${{ github.repository }}, Commit: ${{ github.sha }}, Branch: ${{ github.ref_name }}"
          log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "BUILD_SUMMARY" "Build Reason: ${{ matrix.config.image.reason }}, Runner: ${{ matrix.runs-on }}"

          DURATION=${{ steps.end-time.outputs.duration }}
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))

          log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "BUILD_SUMMARY" "Status: ${{ steps.build.outcome }}, Duration: ${MINUTES}m ${SECONDS}s"

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            DIGEST_SHORT="${{ steps.push.outputs.digest }}"
            DIGEST_SHORT="${DIGEST_SHORT:0:12}"
            log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "BUILD_SUCCESS" "Digest: ${DIGEST_SHORT}..."
          fi

          if [ $DURATION -lt 600 ]; then
            log_structured "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "PERFORMANCE" "Build completed within target (<10 minutes)"
          else
            log_warning "${{ matrix.config.image.name }}" "${{ matrix.config.arch }}" "PERFORMANCE" "Build exceeded 10 minute target"
          fi

      - name: Update build history with performance metrics
        if: steps.verify.outcome == 'success'
        run: |
          # Get digest if build succeeded
          BUILD_DIGEST=""
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            BUILD_DIGEST="${{ steps.push.outputs.digest }}"
          fi

          # Get retry count from push-with-retry step
          RETRY_COUNT="${{ steps.push.outputs.retry_attempts }}"
          if [ -z "$RETRY_COUNT" ]; then
            RETRY_COUNT=0
          fi

          .github/scripts/record-build-history.sh \
            --image-dir "${{ matrix.config.image.name }}" \
            --version "${{ matrix.config.image.version }}" \
            --variant "${{ matrix.config.image.variant }}" \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --arch "${{ matrix.config.arch }}" \
            --build-status "${{ steps.build.outcome }}" \
            --build-start "${{ steps.start-time.outputs.start }}" \
            --build-end "${{ steps.end-time.outputs.end }}" \
            --duration "${{ steps.end-time.outputs.duration }}" \
            --digest "$BUILD_DIGEST" \
            --retry-count "$RETRY_COUNT" \
            --cache-hit-rate "${{ steps.metrics.outputs.cache_hit_rate }}" \
            --image-size "${{ steps.image-size.outputs.image_size }}"

      - name: Prepare history artifact
        if: steps.verify.outcome == 'success'
        run: |
          # Create a temp directory with the image path metadata
          mkdir -p /tmp/history-upload
          echo "${{ matrix.config.image.name }}" > /tmp/history-upload/image_path.txt
          echo "${{ matrix.config.image.variant }}" > /tmp/history-upload/variant.txt

          # Determine history file path based on variant
          IMAGE_DIR="${{ matrix.config.image.name }}"
          VARIANT="${{ matrix.config.image.variant }}"

          if [ -z "$VARIANT" ] || [ "$VARIANT" = "default" ]; then
            HISTORY_FILE="$IMAGE_DIR/history.jsonl"
          else
            HISTORY_FILE="$IMAGE_DIR/history-${VARIANT}.jsonl"
          fi

          # Copy history file if it exists
          if [ -f "$HISTORY_FILE" ]; then
            cp "$HISTORY_FILE" /tmp/history-upload/history.jsonl
          fi

      - name: Upload history artifact
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: history-${{ steps.artifact-name.outputs.escaped }}-${{ matrix.config.image.variant }}-${{ matrix.config.arch }}
          path: /tmp/history-upload/
          retention-days: 1
          if-no-files-found: ignore

      - name: Record rebuild history
        if: always() && github.event.inputs.rebuild_mode == 'true'
        run: |
          source .github/scripts/lib/logging.sh
          source .github/scripts/lib/history.sh

          IMAGE_DIR="${{ matrix.config.image.name }}"
          VERSION="${{ matrix.config.image.version }}"
          REBUILD_REASON="${{ github.event.inputs.rebuild_reason }}"
          BUILD_STATUS="${{ steps.build.outcome }}"
          ARCH="${{ matrix.config.arch }}"

          # Log rebuild completion
          log_structured "$IMAGE_DIR" "$ARCH" "REBUILD" "Rebuild completed: version=$VERSION, reason=$REBUILD_REASON, status=$BUILD_STATUS"

  create-manifest:
    name: Create Multi-Architecture Manifest
    needs: build-arch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.build-arch.result != 'failure' && github.event.inputs.dry_run != 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*

      - name: Download status artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/status
          pattern: status-*

      - name: Create manifests for all images and variants
        run: |
          ./.github/scripts/create-manifests.sh \
            --repo "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --digests-path /tmp/digests \
            --status-path /tmp/status \
            --workspace "${GITHUB_WORKSPACE}"

      - name: Verify tags in registry (T024)
        if: always()
        run: |
          .github/scripts/verify-registry-tags.sh \
            --repository "${{ github.repository }}" \
            --commit-sha "${{ github.sha }}" \
            --branch-name "${{ github.ref_name }}" \
            --digests-path "/tmp/digests" \
            --workspace "${GITHUB_WORKSPACE}"

      - name: Create manifest completion summary
        if: always()
        run: |
          echo "============================================="
          echo "Multi-Architecture Manifest Creation Summary"
          echo "============================================="
          echo "Repository: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo ""
          echo "Successfully created manifests for all built images"

  commit-history:
    name: Commit Build History
    needs: [build-arch, create-manifest]
    runs-on: ubuntu-latest
    if: github.event.inputs.dry_run != 'true' && needs.build-arch.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Download all history artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: history-*
          path: /tmp/history-artifacts

      - name: Merge history files from all architectures
        run: |
          # Use merge script to intelligently combine artifacts from parallel builds
          # This merges records with the same version and combines architecture data
          ./.github/scripts/merge-history-artifacts.sh /tmp/history-artifacts

      - name: Commit updated history files
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add all history files (including untracked ones)
          # Use find to locate both history.jsonl and history-*.jsonl files
          if find . \( -name 'history.jsonl' -o -name 'history-*.jsonl' \) -type f -print0 | xargs -0 -r git add; then
            echo "Added history files"
          else
            echo "No history files found to add"
            exit 0
          fi

          # Check if there are any staged changes
          if git diff --cached --quiet; then
            echo "No history changes to commit"
            exit 0
          fi

          # Create commit with summary
          COMMIT_COUNT=$(git diff --cached --numstat | wc -l)
          git commit -m "chore: update build history" \
            -m "Updated history for $COMMIT_COUNT image(s)" \
            -m "Build ID: ${{ github.run_id }}" \
            -m "Triggered by: ${{ github.event_name }}" \
            -m "" \
            -m "🤖 Generated with GitHub Actions"

          # Push changes
          git push

  workflow-summary:
    name: Workflow Summary Report
    needs: [build-arch, create-manifest]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate workflow summary table
        run: |
          # Generate workflow summary table for all builds
          # Build summary from job statuses
          BUILD_ARCH_RESULT="${{ needs.build-arch.result }}"
          CREATE_MANIFEST_RESULT="${{ needs.create-manifest.result }}"
          DRY_RUN_MODE="${{ github.event.inputs.dry_run }}"

          {
            echo "## Workflow Summary"
            echo ""
            echo "### Build Status"
            echo ""
            echo "| Phase | Status |"
            echo "|-------|--------|"

            if [[ "$DRY_RUN_MODE" == "true" ]]; then
              echo "| Mode | Dry-Run (no builds) |"
            else
              echo "| Mode | Production |"
            fi

            case "$BUILD_ARCH_RESULT" in
              success)
                echo "| Build (arch) | ✓ Success |"
                ;;
              skipped)
                echo "| Build (arch) | ⊘ Skipped |"
                ;;
              failure)
                echo "| Build (arch) | ✗ Failed |"
                ;;
              *)
                echo "| Build (arch) | ? Unknown |"
                ;;
            esac

            case "$CREATE_MANIFEST_RESULT" in
              success)
                echo "| Manifest | ✓ Success |"
                ;;
              skipped)
                echo "| Manifest | ⊘ Skipped |"
                ;;
              failure)
                echo "| Manifest | ✗ Failed |"
                ;;
              *)
                echo "| Manifest | ? Unknown |"
                ;;
            esac

            echo ""
            echo "### Workflow Details"
            echo "- **Repository**: ${{ github.repository }}"
            echo "- **Branch**: ${{ github.ref_name }}"
            echo "- **Commit**: ${{ github.sha }}"
            echo "- **Triggered By**: ${{ github.event_name }}"

            if [[ -n "${{ github.event.inputs.image_filter }}" ]]; then
              echo "- **Image Filter**: ${{ github.event.inputs.image_filter }}"
            fi

            if [[ -n "${{ github.event.inputs.skip_images }}" ]]; then
              echo "- **Skip Images**: ${{ github.event.inputs.skip_images }}"
            fi

            if [[ -n "${{ github.event.inputs.force_rebuild }}" && "${{ github.event.inputs.force_rebuild }}" == "true" ]]; then
              echo "- **Force Rebuild**: Yes (all images)"
            fi

            if [[ -n "${{ github.event.inputs.version_override }}" ]]; then
              echo "- **Version Overrides**: Yes"
            fi

            echo ""
            echo "---"
            echo ""
            echo "For detailed logs, see workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
