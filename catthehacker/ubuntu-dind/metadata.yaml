name: catthehacker-ubuntu-dind
description: Docker-in-Docker enabled version of catthehacker/ubuntu for GitHub Actions
version_source:
  type: docker_tag
  # Watch the act-24.04 tag for version changes
  # Both variants will rebuild when this changes
  # TODO: Enhance to track each variant independently via SHA256
  registry: ghcr.io
  image: catthehacker/ubuntu
  tag_filter: "^act-24\\.04$"
  auth_token_secret: GITHUB_TOKEN

# NOTE: The variants field below is currently documentation-only
# The system auto-discovers variants by scanning for Dockerfile.* files
# See: https://github.com/zaephor/dockerfiles/issues/XXX
# variants:
#   - act-24.04
#   - act-22.04

architectures:
  - amd64
  - arm64

tags:
  # Use variant_only strategy to generate clean variant name tags only
  # This prevents confusing tags like "latest-act-24.04" or "{commit}-act-24.04"
  # Each variant tag (act-24.04, act-22.04) acts as the "latest" for that variant
  strategy: variant_only

labels:
  org.opencontainers.image.title: "catthehacker/ubuntu-dind"
  org.opencontainers.image.description: "Docker-in-Docker enabled catthehacker/ubuntu images for GitHub Actions"
  org.opencontainers.image.url: "https://github.com/zaephor/dockerfiles"
  org.opencontainers.image.source: "https://github.com/zaephor/dockerfiles"
  org.opencontainers.image.vendor: "zaephor"
  org.opencontainers.image.licenses: "MIT"
