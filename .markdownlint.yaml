# Markdown linting configuration
# See https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Default state for all rules
default: true

# MD013: Line length (relaxed for documentation)
MD013:
  line_length: 250
  heading_line_length: 250
  code_block_line_length: 300
  code_blocks: false
  tables: false
  headings: false
  strict: false
  stern: false

# MD022: Headings should be surrounded by blank lines (relaxed)
MD022: false

# MD026: Trailing punctuation in headings (allow for FAQ-style headings)
MD026: false

# MD029: Ordered list item prefix (disabled - allow any numbering)
MD029: false

# MD031: Fenced code blocks should be surrounded by blank lines (relaxed)
MD031: false

# MD032: Lists should be surrounded by blank lines (relaxed)
MD032: false

# MD033: Allow inline HTML (useful for badges, alignment, etc)
MD033: false

# MD034: Allow bare URLs (useful in documentation)
MD034: false

# MD040: Fenced code blocks should have a language (relaxed for examples)
MD040: false

# MD041: First line in file should be a top level heading (relaxed for READMEs)
MD041: false

# MD046: Code block style (allow both fenced and indented)
MD046:
  style: consistent

# MD024: Allow duplicate headings (common in changelog/docs)
MD024: false

# MD025: Multiple top level headings (allow for docs with sections)
MD025: false

# MD036: Emphasis used instead of heading (allow bold for emphasis)
MD036: false
